# Server
server.port=8080
server.servlet.context-path=/

# MongoDB (shared with FastAPI during dev—safe, they use the same collections)
spring.data.mongodb.uri=${MONGO_URL:mongodb://localhost:27017}
spring.data.mongodb.database=${DB_NAME:test_database}

# JWT (same 30-day lifetime as FastAPI)
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-string-in-production-this-is-only-for-dev}
app.jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:2592000}

# OTP rate-limit configuration
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.send-cooldown-seconds=${OTP_SEND_COOLDOWN:30}
app.otp.demo-mode=${OTP_DEMO_MODE:true}

# Logging
logging.level.tech.skyno.lendiq=DEBUG
